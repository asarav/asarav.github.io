name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Links and HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: |
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee build.log

      # Public Actions logs need a signed-in session, but check-run annotations
      # are readable through the API, so surface the error there too.
      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Jekyll build failed::${msg}"
          fi

      - name: Check internal links and HTML
        run: |
          gem install html-proofer --no-document
          # Rewrite absolute site URLs to root-relative so internal links are
          # checked against the build instead of the live site.
          htmlproofer ./_site \
            --disable-external \
            --swap-urls "^https://asarav.github.io:" \
            --allow-hash-href

      # Amazon, LinkedIn, Goodreads and friends answer bots with 403/999, so a
      # failure here is usually not a real broken link. Report it, do not fail.
      - name: Check external links (non-blocking)
        continue-on-error: true
        run: |
          htmlproofer ./_site \
            --swap-urls "^https://asarav.github.io:" \
            --ignore-status-codes "401,403,429,503,999" \
            --allow-hash-href

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: |
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Jekyll build failed::${msg}"
          fi

      - name: Run Lighthouse CI
        run: |
          bundle exec jekyll serve --port 4000 --detach --skip-initial-build
          npx --yes wait-on@7 http://127.0.0.1:4000/ --timeout 60000
          npx --yes @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

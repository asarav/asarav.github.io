name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build and gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      # Public Actions logs need a signed-in session, but check-run annotations
      # are readable through the API, so surface the failures there too.
      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Astro build failed::${msg}"
          fi

      # The service worker precaches a fixed list. If a rename or a dropped
      # asset makes one entry stale, install() silently caches less than it
      # claims and the offline shell dies with no build error.
      - name: Check service worker shell
        run: pnpm check:sw

      # The public tree ships verbatim, so it must still hash-match its source.
      - name: Check public tree
        run: pnpm public:check

      # Asset URLs are root-absolute everywhere; a relative one breaks under
      # the service worker's cached shell.
      - name: Check root-absolute URLs
        run: pnpm check:urls

      # Stylesheets and scripts are minified at build time, so compare the
      # shipped bytes against the minified source (and, locally, the Jekyll
      # baseline).
      - name: Check CSS
        run: pnpm check:css

      - name: Check scripts
        run: pnpm check:js

      - name: Check image dimensions
        run: pnpm check:images

      - name: Check internal links
        run: pnpm check:links

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Astro build failed::${msg}"
          fi

      - name: Run Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          # Keep the server off the step's stdout, otherwise the runner waits for
          # the inherited pipe to close and the step never finishes.
          pnpm preview --port 4000 > /tmp/serve.log 2>&1 &
          SERVER_PID=$!
          npx --yes wait-on@7 http://127.0.0.1:4000/ --timeout 60000
          npx --yes @lhci/cli@0.14.x autorun 2>&1 | tee lhci.log
          kill $SERVER_PID

      - name: Report Lighthouse failure
        if: failure()
        run: |
          if [ -f lhci.log ]; then
            msg=$(grep -E "✕|failed|error|assertion" lhci.log | tail -25 | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Lighthouse CI failed::${msg}"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

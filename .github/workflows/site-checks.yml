name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Links and HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: |
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee build.log

      # Public Actions logs need a signed-in session, but check-run annotations
      # are readable through the API, so surface the failures there too.
      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Jekyll build failed::${msg}"
          fi

      - name: Check internal links and HTML
        run: |
          set -o pipefail
          gem install html-proofer --no-document
          # Rewrite absolute site URLs to root-relative so internal links are
          # checked against the build instead of the live site.
          # Internal links are root-relative, so no URL rewriting is needed;
          # --swap-urls splits on the first colon and mangles absolute URLs.
          # unity3d.com is http-only inside vendored Unity builds, and
          # ii.tudelft.nl is unreachable on both 80 and 443, so neither can
          # satisfy the HTTPS check.
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls "http://unity3d.com/,http://ii.tudelft.nl/genius/" 2>&1 | tee proofer.log

      - name: Report link failures
        if: failure()
        run: |
          if [ -s proofer.log ]; then
            msg=$(tail -n 45 proofer.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=html-proofer failed::${msg}"
          fi

      # Amazon, LinkedIn, Goodreads and friends answer bots with 403/999, so a
      # failure here is usually not a real broken link. Report it, do not fail.
      - name: Check external links (non-blocking)
        continue-on-error: true
        run: |
          htmlproofer ./_site \
            --ignore-status-codes "401,403,429,503,999" \
            --allow-hash-href

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: |
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Jekyll build failed::${msg}"
          fi

      - name: Run Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          # Keep the server off the step's stdout, otherwise the runner waits for
          # the inherited pipe to close and the step never finishes.
          bundle exec jekyll serve --port 4000 --skip-initial-build > /tmp/serve.log 2>&1 &
          SERVER_PID=$!
          npx --yes wait-on@7 http://127.0.0.1:4000/ --timeout 60000
          npx --yes @lhci/cli@0.14.x autorun 2>&1 | tee lhci.log
          kill $SERVER_PID

      - name: Report Lighthouse failure
        if: failure()
        run: |
          if [ -f lhci.log ]; then
            msg=$(grep -E "✕|failed|error|assertion" lhci.log | tail -25 | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-1800)
            echo "::error title=Lighthouse CI failed::${msg}"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

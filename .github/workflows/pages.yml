name: Deploy site

# The workflow builds the Astro site with the repo's pinned pnpm toolchain and
# hands dist/ to deploy-pages, instead of Pages building the branch with its own
# fixed Jekyll gem set. Keep this in step with site-checks.yml, which runs the
# same build (plus the gates) on every push.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight deploy finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/configure-pages@v5
        id: pages

      - name: Install
        run: pnpm install --frozen-lockfile

      # astro.config.mjs sets `site` to the custom domain root, so no base path
      # is passed in; asset URLs stay root-absolute as the service worker
      # expects.
      - name: Build with Astro
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

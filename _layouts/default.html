<!DOCTYPE html>
	<html lang="en">
        <head>
            <title>{{ page.title }} | asarav</title>

            <meta name="author" content="Avinash Saravanan">

            <link rel="icon" type="image/svg+xml" href="{{ 'favicon.svg' | relative_url }}">
            <link rel="shortcut icon" href="{{ 'favicon.png' | relative_url }}">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

            {% if page.style %}
                <link rel="stylesheet" type="text/css" href="{{ page.style | relative_url }}">

        <body id="site" class="site{% if page.url == '/' %} home-page{% endif %}">

            {% include nav.html %}
            <main id="content" class="container-fluid">
                {{ content }}
            </main>
            {% include footer.html %}
            {% if page.script %}
                <script type="text/javascript" src="{{ page.script | relative_url }}"></script>
            {% endif %}
            <script type="text/javascript" src="{{ 'src/scripts/media-fallback.js' | relative_url }}"></script>
            <script type="text/javascript" src="{{ 'src/scripts/brand-mark.js' | relative_url }}"></script>
        </body>

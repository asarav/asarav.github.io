<!DOCTYPE html>
	<html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="dark">
            <title>{% if page.url == '/' %}{{ page.title }}{% else %}{{ page.title }} | asarav{% endif %}</title>
            <meta name="author" content="Avinash Saravanan">
            <meta name="keywords" content="Avinash,Saravanan,Software,Engineer,Scientist,Novelist,Guitar,Games,Music,Dance,AI,Badass,asarav,Developer,Programmer">
            <meta name="google-site-verification" content="pgJJ8njw6GLljKN4caY8Xtz5zoMPTyBsdpK6CMRhNBM" />
            <script>
                // Opt into scroll-triggered motion only when the browser can
                // support it. The timeout restores normal animations if the
                // motion bundle fails to load for any reason.
                (function () {
                    var root = document.documentElement;

                    if (!('IntersectionObserver' in window)) {
                        return;
                    }

                    root.classList.add('js-motion');

                    window.setTimeout(function () {
                        if (!root.classList.contains('motion-ready')) {
                            root.classList.remove('js-motion');
                        }
                    }, 1500);
                })();
            </script>
            <meta name="theme-color" content="#070b10">
            <link rel="icon" type="image/svg+xml" href="{{ 'favicon.svg' | relative_url }}">
            <link rel="shortcut icon" href="{{ 'favicon.png' | relative_url }}">
            {% if page.url == '/projects/' %}
            <link rel="alternate" type="application/json" href="{{ '/projects.json' | relative_url }}" title="Machine-readable project index">
            {% endif %}
            <script>
                window.__calendar = [
                    {% for item in site.data.calendar %}
                    { "month": {{ item.month | jsonify }}, "day": {{ item.day | jsonify }}, "page": {{ item.page | jsonify }}, "label": {{ item.label | jsonify }} }{% unless forloop.last %},{% endunless %}
                    {% endfor %}
                ];
            </script>
            {% if page.url == '/' %}
            <link rel="preload" as="image" href="{{ 'src/images/homepage_tiles/projects.jpg' | relative_url }}" fetchpriority="high">
            {% endif %}
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
            <!--Stylesheets -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
            <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;700&family=Syne:wght@700&display=swap" rel="stylesheet">
            <link rel="stylesheet" type="text/css" href="{{ 'assets/css/main.css' | relative_url }}">
            {% if page.style %}
                <link rel="stylesheet" type="text/css" href="{{ page.style | relative_url }}">
            {% endif %}
{% seo title=false %}

      ]
    },
    {

      "@id": "https://asarav.github.io/#website",

<script type="speculationrules">
{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}
</script>
        </head>
        <body id="site" class="site{% if page.url == '/' %} home-page{% endif %}" data-image-root="{{ 'src/images/' | relative_url }}">
            {% include ui-icons.html %}
            <a class="skip-link" href="#content">Skip to content</a>
<div class="scroll-progress" aria-hidden="true"></div>
            {% include nav.html %}
            <main id="content" class="container-fluid">
                {{ content }}
            </main>
            {% include footer.html %}
            <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
            {% if page.script %}
                <script defer type="text/javascript" src="{{ page.script | relative_url }}"></script>
            {% endif %}
            <script defer type="text/javascript" src="{{ 'assets/js/media-fallback.js' | relative_url }}"></script>
            <script defer type="text/javascript" src="{{ 'assets/js/site-motion.js' | relative_url }}"></script>
<script defer type="text/javascript" src="{{ 'assets/js/ambient-sound.js' | relative_url }}"></script>
            <script defer type="text/javascript" src="{{ 'assets/js/brand-mark.js' | relative_url }}"></script>
            <script>
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('{{ 'sw.js' | relative_url }}').catch(function () {});
                    });
                }
            </script>
        </body>
	</html>

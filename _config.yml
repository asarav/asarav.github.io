name: Avinash Saravanan, asarav
title: Avinash Saravanan, asarav
description: Personal portfolio website showcasing projects, games, music, books, and media consumption
author: Avinash Saravanan
url: https://asarav.github.io
image: /assets/images/homepage_tiles/projects.jpg
markdown: kramdown

# Build settings
exclude:
  - node_modules/
  - .git/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs/
  - .vscode/
  - .DS_Store
  - .github/
  - lighthouserc.json
  - .lighthouseci/
  # This list replaces Jekyll's defaults, which normally exclude bundled gems;
  # CI installs them into vendor/bundle inside the checkout.
  - vendor/

# Jekyll plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Keep published game/project builds and repo meta pages out of the sitemap.
defaults:
  - scope:
      path: "assets/games"
    values:
      sitemap: false
  - scope:
      path: "assets/projects"
    values:
      sitemap: false
  - scope:
      path: "CHANGELOG.md"
    values:
      sitemap: false
  - scope:
      path: "SECURITY.md"
    values:
      sitemap: false

# Dart Sass emits source maps by default; they would be published next to the
# stylesheets. The stylesheets are read as static files on this site, so the
# maps help nobody.
sass:
  sourcemap: never

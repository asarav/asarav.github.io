name: Avinash Saravanan, asarav
title: Avinash Saravanan, asarav
description: Personal portfolio website showcasing projects, games, music, books, and media consumption
author: Avinash Saravanan
url: https://asarav.github.io
image: /src/images/homepage_tiles/projects.jpg
markdown: kramdown

# Build settings
exclude:
  - node_modules/
  - .git/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs/
  - .vscode/
  - .DS_Store

# Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Keep generated source/game builds and repo meta pages out of the sitemap.
defaults:
  - scope:
      path: "src/games"
    values:
      sitemap: false
  - scope:
      path: "src/projects"
    values:
      sitemap: false
  - scope:
      path: "CHANGELOG.md"
    values:
      sitemap: false
  - scope:
      path: "SECURITY.md"
    values:
      sitemap: false